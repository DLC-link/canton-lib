name: Release

# Maintains a single "release PR" that bumps the workspace version and writes
# CHANGELOG.md from the Conventional Commit prefixes since the last tag. Merging
# that PR is what cuts the release.
#
# A normal PR never touches the version. That is the point: one shared version
# line means two open PRs always conflict on it, and re-bumping after a review
# dismisses the approval.
#
# Nothing is published to crates.io — see publish = false in release-plz.toml.
# No CARGO_REGISTRY_TOKEN is required.
#
# Safe to merge and observe: the release job below only acts when the version in
# Cargo.toml has no matching git tag. The current version (0.6.1) is already
# tagged v0.6.1, so it does nothing until a release PR is merged.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # release-plz reads tags and full history to work out the next version.
          fetch-depth: 0
      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag and publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # libprotobuf-dev holds the google/protobuf/*.proto files that the
      # canton-proto-rs build script imports.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install the pinned toolchain and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Check canton-proto-rs and common without default features
        run: cargo check -p canton-proto-rs -p common --no-default-features --target wasm32-unknown-unknown

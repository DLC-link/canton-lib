[workspace]
members = [
  "crates/common",
  "crates/cryptography",
  "crates/examples",
  "crates/keycloak",
  "crates/ledger",
  "crates/ledgrpc",
  "crates/registry",
  "crates/token",
  "crates/wallet",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.10.1"

[profile.release]
opt-level = 3
strip = "debuginfo"
codegen-units = 1
lto = true
panic = "unwind"

[workspace.dependencies]
base64 = { version = "0.22.1" }
canton-api-client = { git = "https://github.com/ksrichard/canton-api-rust-client", rev = "befc9f359fb62d9cb0b4da0b7f3526f4e2a1166a" }
chrono = { version = "0.4" }
common = { path = "crates/common" }
csv = { version = "1.3" }
dotenvy = { version = "0.15" }
env_logger = { version = "0.11" }
keycloak = { path = "crates/keycloak" }
ledger = { path = "crates/ledger" }
log = { version = "0.4" }
registry = { path = "crates/registry" }
reqwest = { version = "0.12.24" }
semver = { version = "1" }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1.0.228" }
serde_json = { version = "1.0" }
tokio = { version = "1.48" }
tokio-macros = { version = "2.5.0" }
token = { path = "crates/token" }
uuid = { version = "1.18" }
wiremock = { version = "0.6" }
zip = { version = "2" }
